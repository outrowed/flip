<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" role="img" aria-label="FLIP Favicon">
  <title>FLIP Favicon</title>
  <defs>
    <!-- Outer metallic casing gradient -->
    <linearGradient id="fav-casing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2634"/>
      <stop offset="50%" stop-color="#121722"/>
      <stop offset="100%" stop-color="#090b10"/>
    </linearGradient>

    <!-- Deep solenoid well gradient -->
    <radialGradient id="fav-socket" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#181f2a"/>
      <stop offset="75%" stop-color="#0b0e14"/>
      <stop offset="100%" stop-color="#05070a"/>
    </radialGradient>

    <!-- Active amber flip-disc gradient -->
    <linearGradient id="fav-disc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="25%" stop-color="#fbbf24"/>
      <stop offset="85%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Specular rim highlight -->
    <linearGradient id="fav-rim-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient amber glow filter -->
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f59e0b" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer rounded bezel frame -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#fav-casing)" stroke="#2e384d" stroke-width="3"/>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none" stroke="url(#fav-rim-glow)" stroke-width="1.5"/>

  <!-- Solenoid socket well -->
  <circle cx="64" cy="64" r="48" fill="url(#fav-socket)" stroke="#1a2230" stroke-width="2.5"/>

  <!-- Active amber flip disc with glow -->
  <circle cx="64" cy="64" r="36" fill="url(#fav-disc)" stroke="#fcd34d" stroke-width="2" filter="url(#fav-glow)"/>

  <!-- Inner mechanical core detail -->
  <circle cx="64" cy="64" r="14" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5" opacity="0.9"/>
  <circle cx="64" cy="64" r="5" fill="#fef08a"/>

  <!-- Subtle glass specular reflection arc -->
  <path d="M 38 42 A 34 34 0 0 1 88 40" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.45"/>
</svg>
